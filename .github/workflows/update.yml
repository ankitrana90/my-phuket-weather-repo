name: Update Phuket Weather Data

on:
  schedule:
    # Runs every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./my-phuket-weather-repo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TMD Weather Script
        working-directory: ./my-phuket-weather-repo
        run: |
          python tmd_weather_dashboard_bot.py --once

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff-index --quiet HEAD || git commit -m "Automated weather data update [skip ci]"
          git push
