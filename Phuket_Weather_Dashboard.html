<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phuket Weather Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg-light: #F8FAFC;
    --card-bg: rgba(255, 255, 255, 0.75);
    --card-border: 1px solid rgba(226, 232, 240, 0.8);
    --card-shadow: 0 15px 35px -10px rgba(15, 23, 42, 0.05);
    --text-primary: #0F172A;
    --text-secondary: #64748B;
    --accent-blue: #3B82F6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    background-color: var(--bg-light);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 32px 24px;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
  }

  /* Header Section */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
  }

  .location-info h1 {
    font-size: 36px;
    font-weight: 600;
    letter-spacing: -0.8px;
    color: var(--text-primary);
  }

  .location-info .meta {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .station-select {
    appearance: none;
    background: var(--card-bg);
    border: var(--card-border);
    backdrop-filter: blur(20px);
    color: var(--text-primary);
    padding: 10px 18px;
    border-radius: 18px;
    font-size: 14px;
    font-weight: 500;
    outline: none;
    cursor: pointer;
    box-shadow: var(--card-shadow);
    transition: all 0.2s ease;
  }
  .station-select:hover {
    transform: translateY(-2px);
    border-color: var(--accent-blue);
  }

  /* Hero Display Card */
  .hero-card {
    background: var(--card-bg);
    border: var(--card-border);
    backdrop-filter: blur(25px);
    border-radius: 28px;
    padding: 32px;
    box-shadow: var(--card-shadow);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }

  .hero-left {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .hero-emoji {
    font-size: 54px;
    line-height: 1;
  }

  .hero-val {
    font-size: 52px;
    font-weight: 300;
    letter-spacing: -1.5px;
    line-height: 1;
  }

  .hero-status {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 6px;
  }

  /* Daily Tiles Grid */
  .grid-title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.4px;
    margin-bottom: 18px;
  }

  .tiles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  /* Daily Weather Tile */
  .day-tile {
    position: relative;
    background: var(--card-bg);
    border: var(--card-border);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 24px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 180px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .day-tile:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.08);
  }

  /* Embedded Water Level Animation Bar */
  .water-level-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(59, 130, 246, 0.15) 0%, rgba(59, 130, 246, 0.3) 100%);
    transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    z-index: 1;
  }

  /* Embedded Rain Particle Canvas */
  .tile-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  .tile-content {
    position: relative;
    z-index: 3;
  }

  .tile-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .tile-date {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .tile-emoji {
    font-size: 28px;
  }

  .tile-value {
    font-size: 34px;
    font-weight: 300;
    letter-spacing: -1px;
    color: var(--text-primary);
  }

  .tile-commentary {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.4;
    margin-top: 12px;
  }

  @media (max-width: 640px) {
    .tiles-grid { grid-template-columns: 1fr; }
    .hero-card { flex-direction: column; align-items: flex-start; gap: 20px; }
  }
</style>
</head>
<body>

  <div class="container">
    <header>
      <div class="location-info">
        <h1>Phuket, Thailand</h1>
        <div class="meta" id="headerMeta">Syncing live data...</div>
      </div>
      <select id="stationSelect" class="station-select"></select>
    </header>

    <!-- Hero Card -->
    <div class="hero-card">
      <div class="hero-left">
        <div class="hero-emoji" id="heroEmoji">🌦️</div>
        <div>
          <div class="hero-val" id="heroVal">-- mm</div>
          <div class="hero-status" id="heroStatus">Scanning precipitation...</div>
        </div>
      </div>
    </div>

    <div class="grid-title">Daily Weather Intelligence</div>
    <div class="tiles-grid" id="tilesGrid"></div>
  </div>

<script>
const CONFIG = {"data_sheet_name": "Phuket Weather", "xlsx_filename": "Phuket_Weather.xlsx", "metrics": [{"code": "Rain", "column": "Rainfall_mm", "label": "Rainfall (mm)"}, {"code": "Wind", "column": "WindSpeed", "label": "Wind Speed (km/h)"}, {"code": "Vis", "column": "LandVisibility", "label": "Land Visibility (km)"}], "stations": [{"code": "AIRPORT", "label_raw": "PHUKET AIRPORT", "label_display": "Phuket Airport"}, {"code": "PHUKET", "label_raw": "PHUKET", "label_display": "Phuket"}, {"code": "COMBINED", "label_raw": "PHUKET (COMBINED)", "label_display": "Phuket (Combined)"}], "rainfall_cap": 15};
const stationSelect = document.getElementById('stationSelect');
let DATA = null;
let activeCanvasRenderers = [];

CONFIG.stations.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s.code; opt.textContent = s.label_display;
  if (s.code === 'COMBINED') opt.selected = true;
  stationSelect.appendChild(opt);
});

async function autoFetchServerData() {
  try {
    const res = await fetch(CONFIG.xlsx_filename, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const buffer = await res.arrayBuffer();
    
    const wb = XLSX.read(buffer, { type: 'array', cellDates: true });
    const sheet = wb.Sheets[CONFIG.data_sheet_name];
    if (!sheet) throw new Error("Data sheet missing");

    const rows = XLSX.utils.sheet_to_json(sheet, { defval: null });
    DATA = buildDataFromRows(rows);
    document.getElementById('headerMeta').textContent = `Updated Live • ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
    renderTiles();
  } catch (err) {
    document.getElementById('headerMeta').textContent = 'Displaying cached telemetry';
  }
}

function pad(n) { return n.toString().padStart(2, '0'); }
function parseDateTime(v) {
  if (!v) return null;
  const d = (v instanceof Date) ? v : new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

function buildDataFromRows(rows) {
  const buckets = {};
  const dateSet = new Set();
  const timeSet = new Set();
  const columns = CONFIG.metrics.map(m => m.column);

  rows.forEach(row => {
    const dt = parseDateTime(row.DateTime);
    const station = row.Station;
    if (!dt || !station) return;

    const dateStr = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
    const timeStr = `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
    dateSet.add(dateStr); timeSet.add(timeStr);

    buckets[station] = buckets[station] || {};
    buckets[station][dateStr] = buckets[station][dateStr] || {};
    const slot = buckets[station][dateStr][timeStr] =
      buckets[station][dateStr][timeStr] || Object.fromEntries(columns.map(c => [c, []]));

    columns.forEach(col => {
      const v = row[col];
      if (v !== null && v !== undefined && v !== '' && !isNaN(Number(v))) slot[col].push(Number(v));
    });
  });

  const dates = Array.from(dateSet).sort();
  const times = Array.from(timeSet).sort((a, b) => a.localeCompare(b));

  const round2 = x => Math.round(x * 100) / 100;
  const mean = arr => arr.length ? round2(arr.reduce((a, b) => a + b, 0) / arr.length) : null;

  const payload = {};
  CONFIG.metrics.forEach(m => {
    payload[m.code] = {};
    CONFIG.stations.forEach(s => {
      const stationLabel = s.label_raw;
      const grid = dates.map(d => times.map(t => {
        const slot = buckets[stationLabel] && buckets[stationLabel][d] && buckets[stationLabel][d][t];
        return slot ? mean(slot[m.column]) : null;
      }));
      const summary = grid.map(rowVals => {
        const present = rowVals.filter(v => v !== null);
        if (!present.length) return null;
        return m.code === 'Rain' ? round2(present.reduce((a, b) => a + b, 0)) : mean(present);
      });
      payload[m.code][s.code] = { grid, summary };
    });
  });

  return { dates, times, payload };
}

/* Dynamic Commentary & Emoji Evaluation */
function evaluateWeather(rain) {
  if (rain >= 25) {
    return { emoji: '⛈️', commentary: 'Torrential downpours with elevated thunder activity.' };
  } else if (rain >= 12) {
    return { emoji: '🌧️', commentary: 'Heavy monsoon rainfall expected throughout the day.' };
  } else if (rain >= 4) {
    return { emoji: '🌦️', commentary: 'Passing scattered rain showers across the island.' };
  } else if (rain > 0) {
    return { emoji: '🌤️', commentary: 'Light intermittent drizzle with mostly dry intervals.' };
  } else {
    return { emoji: '☀️', commentary: 'Optimal clear atmospheric conditions with no rainfall.' };
  }
}

/* In-Tile Rain Particle Renderer */
function attachRainCanvas(canvasId, rainVal) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;

  if (rainVal <= 0) return;

  const particles = [];
  const count = Math.min(Math.floor(rainVal * 6) + 6, 80);

  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      len: Math.random() * 12 + 6,
      speed: Math.random() * 4 + 3
    });
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(59, 130, 246, 0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    particles.forEach(p => {
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - 1, p.y + p.len);
      p.y += p.speed;
      if (p.y > canvas.height) {
        p.y = -p.len;
        p.x = Math.random() * canvas.width;
      }
    });
    ctx.stroke();
    const animId = requestAnimationFrame(render);
    activeCanvasRenderers.push(animId);
  }
  render();
}

function renderTiles() {
  if (!DATA) return;

  // Clear previous animation loops
  activeCanvasRenderers.forEach(id => cancelAnimationFrame(id));
  activeCanvasRenderers = [];

  const station = stationSelect.value;
  const rainData = DATA.payload.Rain[station];

  const latestRain = rainData.summary.filter(v => v !== null).pop() || 0;
  const latestEval = evaluateWeather(latestRain);

  document.getElementById('heroVal').textContent = `${latestRain} mm`;
  document.getElementById('heroEmoji').textContent = latestEval.emoji;
  document.getElementById('heroStatus').textContent = `Latest Daily Summary • ${latestEval.commentary}`;

  const tilesGrid = document.getElementById('tilesGrid');
  tilesGrid.innerHTML = '';

  DATA.dates.forEach((d, i) => {
    const totalRain = rainData.summary[i] !== null ? rainData.summary[i] : 0;
    const evalData = evaluateWeather(totalRain);
    
    // Calculate water fill percentage (capped)
    const fillPercent = Math.min(100, (totalRain / CONFIG.rainfall_cap) * 100);

    const tile = document.createElement('div');
    tile.className = 'day-tile';
    tile.innerHTML = `
      <div class="water-level-bar" style="height: ${fillPercent}%;"></div>
      <canvas class="tile-canvas" id="canvas-${i}"></canvas>
      <div class="tile-content">
        <div class="tile-header">
          <div class="tile-date">${d}</div>
          <div class="tile-emoji">${evalData.emoji}</div>
        </div>
        <div class="tile-value">${totalRain} <span style="font-size:18px">mm</span></div>
        <div class="tile-commentary">${evalData.commentary}</div>
      </div>
    `;

    tilesGrid.appendChild(tile);
    setTimeout(() => attachRainCanvas(`canvas-${i}`, totalRain), 50);
  });
}

stationSelect.addEventListener('change', renderTiles);
window.addEventListener('resize', renderTiles);
window.addEventListener('DOMContentLoaded', autoFetchServerData);
</script>
</body>
</html>
