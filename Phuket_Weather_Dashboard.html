<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phuket Weather Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg-light: #F8FAFC;
    --card-bg: rgba(255, 255, 255, 0.85);
    --card-border: 1px solid rgba(226, 232, 240, 0.8);
    --card-shadow: 0 15px 35px -10px rgba(15, 23, 42, 0.05);
    --text-primary: #0F172A;
    --text-secondary: #64748B;
    --accent-blue: #3B82F6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    background-color: var(--bg-light);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 32px 24px;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1280px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
  }

  .location-info h1 {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.8px;
    color: var(--text-primary);
  }

  .location-info .meta {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .station-select {
    appearance: none;
    background: var(--card-bg);
    border: var(--card-border);
    backdrop-filter: blur(20px);
    color: var(--text-primary);
    padding: 10px 18px;
    border-radius: 18px;
    font-size: 14px;
    font-weight: 500;
    outline: none;
    cursor: pointer;
    box-shadow: var(--card-shadow);
    transition: all 0.2s ease;
  }
  .station-select:hover {
    transform: translateY(-2px);
    border-color: var(--accent-blue);
  }

  /* Hero Display Card */
  .hero-card {
    background: var(--card-bg);
    border: var(--card-border);
    backdrop-filter: blur(25px);
    border-radius: 28px;
    padding: 28px 32px;
    box-shadow: var(--card-shadow);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }

  .hero-left {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .hero-emoji {
    font-size: 48px;
    line-height: 1;
  }

  .hero-val {
    font-size: 44px;
    font-weight: 300;
    letter-spacing: -1.5px;
    line-height: 1;
  }

  .hero-status {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 6px;
  }

  .grid-title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.4px;
    margin-bottom: 16px;
  }

  .matrix-wrapper {
    background: var(--card-bg);
    border: var(--card-border);
    backdrop-filter: blur(25px);
    border-radius: 24px;
    box-shadow: var(--card-shadow);
    overflow: auto;
    padding: 12px;
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 10px;
    font-size: 13px;
    text-align: center;
  }

  th {
    padding: 12px 8px;
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: -0.2px;
  }

  th.date-col {
    text-align: left;
    padding-left: 16px;
    min-width: 150px;
  }

  th.summary-col {
    min-width: 220px;
    text-align: left;
    padding-left: 16px;
  }

  td.date-cell {
    text-align: left;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 16px;
    border: 1px solid rgba(226, 232, 240, 0.6);
  }

  .date-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .date-emoji {
    font-size: 20px;
    margin-top: 4px;
  }

  td.time-cell {
    position: relative;
    width: 82px;
    height: 80px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 16px;
    border: 1px solid rgba(226, 232, 240, 0.6);
    overflow: hidden;
    vertical-align: middle;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  td.time-cell:hover {
    transform: scale(1.04);
    border-color: var(--accent-blue);
  }

  .water-level-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(59, 130, 246, 0.2) 0%, rgba(59, 130, 246, 0.45) 100%);
    transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    z-index: 1;
  }

  .cell-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  .cell-content {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
  }

  .val-num {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text-primary);
  }

  .val-unit {
    font-size: 10px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  td.summary-cell {
    text-align: left;
    padding: 12px 18px;
    background: rgba(59, 130, 246, 0.06);
    border-radius: 16px;
    border: 1px solid rgba(59, 130, 246, 0.15);
  }

  .summary-val {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent-blue);
  }

  .summary-commentary {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.35;
    margin-top: 4px;
  }

  @media (max-width: 768px) {
    .hero-card { flex-direction: column; align-items: flex-start; gap: 16px; }
  }
</style>
</head>
<body>

  <div class="container">
    <header>
      <div class="location-info">
        <h1>Phuket, Thailand</h1>
        <div class="meta" id="headerMeta">Syncing live telemetry...</div>
      </div>
      <select id="stationSelect" class="station-select"></select>
    </header>

    <!-- Hero Card -->
    <div class="hero-card">
      <div class="hero-left">
        <div class="hero-emoji" id="heroEmoji">🌦️</div>
        <div>
          <div class="hero-val" id="heroVal">-- mm</div>
          <div class="hero-status" id="heroStatus">Scanning precipitation pattern...</div>
        </div>
      </div>
    </div>

    <div class="grid-title">Time-of-Day Rainfall Matrix (Descending Date Order)</div>
    
    <div class="matrix-wrapper">
      <table id="matrixTable"></table>
    </div>
  </div>

<script>
const CONFIG = {"data_sheet_name": "Phuket Weather", "xlsx_filename": "Phuket_Weather.xlsx", "metrics": [{"code": "Rain", "column": "Rainfall_mm", "label": "Rainfall (mm)"}, {"code": "Wind", "column": "WindSpeed", "label": "Wind Speed (km/h)"}, {"code": "Vis", "column": "LandVisibility", "label": "Land Visibility (km)"}], "stations": [{"code": "AIRPORT", "label_raw": "PHUKET AIRPORT", "label_display": "Phuket Airport"}, {"code": "PHUKET", "label_raw": "PHUKET", "label_display": "Phuket"}, {"code": "COMBINED", "label_raw": "PHUKET (COMBINED)", "label_display": "Phuket (Combined)"}], "rainfall_cap": 15};
const stationSelect = document.getElementById('stationSelect');
let DATA = null;
let activeCanvasRenderers = [];

CONFIG.stations.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s.code; opt.textContent = s.label_display;
  if (s.code === 'COMBINED') opt.selected = true;
  stationSelect.appendChild(opt);
});

async function autoFetchServerData() {
  try {
    const res = await fetch(CONFIG.xlsx_filename, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const buffer = await res.arrayBuffer();
    
    const wb = XLSX.read(buffer, { type: 'array', cellDates: true });
    const sheet = wb.Sheets[CONFIG.data_sheet_name];
    if (!sheet) throw new Error("Data sheet missing");

    const rows = XLSX.utils.sheet_to_json(sheet, { defval: null });
    DATA = buildDataFromRows(rows);
    
    document.getElementById('headerMeta').textContent = 
      `Latest XML Record: ${DATA.latestDateTime || 'Unknown'} • Rendered ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
    
    renderMatrix();
  } catch (err) {
    document.getElementById('headerMeta').textContent = 'Displaying cached telemetry';
  }
}

function pad(n) { return n.toString().padStart(2, '0'); }
function parseDateTime(v) {
  if (!v) return null;
  const d = (v instanceof Date) ? v : new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

function buildDataFromRows(rows) {
  const buckets = {};
  const dateSet = new Set();
  const timeSet = new Set();
  const columns = CONFIG.metrics.map(m => m.column);
  let latestParsedDT = null;

  rows.forEach(row => {
    const dt = parseDateTime(row.DateTime);
    const station = row.Station;
    if (!dt || !station) return;

    if (!latestParsedDT || dt > latestParsedDT) {
      latestParsedDT = dt;
    }

    const dateStr = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
    const timeStr = `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
    dateSet.add(dateStr); timeSet.add(timeStr);

    buckets[station] = buckets[station] || {};
    buckets[station][dateStr] = buckets[station][dateStr] || {};
    const slot = buckets[station][dateStr][timeStr] =
      buckets[station][dateStr][timeStr] || Object.fromEntries(columns.map(c => [c, []]));

    columns.forEach(col => {
      const v = row[col];
      if (v !== null && v !== undefined && v !== '' && !isNaN(Number(v))) slot[col].push(Number(v));
    });
  });

  // SORT DATES IN DESCENDING ORDER (Newest on top)
  const dates = Array.from(dateSet).sort((a, b) => b.localeCompare(a));
  const times = Array.from(timeSet).sort((a, b) => a.localeCompare(b));

  const round2 = x => Math.round(x * 100) / 100;
  const mean = arr => arr.length ? round2(arr.reduce((a, b) => a + b, 0) / arr.length) : null;

  const payload = {};
  CONFIG.metrics.forEach(m => {
    payload[m.code] = {};
    CONFIG.stations.forEach(s => {
      const stationLabel = s.label_raw;
      const grid = dates.map(d => times.map(t => {
        const slot = buckets[stationLabel] && buckets[stationLabel][d] && buckets[stationLabel][d][t];
        return slot ? mean(slot[m.column]) : null;
      }));
      const summary = grid.map(rowVals => {
        const present = rowVals.filter(v => v !== null);
        if (!present.length) return null;
        return m.code === 'Rain' ? round2(present.reduce((a, b) => a + b, 0)) : mean(present);
      });
      payload[m.code][s.code] = { grid, summary };
    });
  });

  const latestFormatted = latestParsedDT 
    ? `${latestParsedDT.getFullYear()}-${pad(latestParsedDT.getMonth() + 1)}-${pad(latestParsedDT.getDate())} ${pad(latestParsedDT.getHours())}:${pad(latestParsedDT.getMinutes())}` 
    : 'N/A';

  return { dates, times, payload, latestDateTime: latestFormatted };
}

function evaluateWeather(rain) {
  if (rain >= 25) {
    return { emoji: '⛈️', commentary: 'Torrential downpours with thunder activity.' };
  } else if (rain >= 12) {
    return { emoji: '🌧️', commentary: 'Heavy monsoon rainfall across multiple hours.' };
  } else if (rain >= 4) {
    return { emoji: '🌦️', commentary: 'Passing scattered showers throughout the day.' };
  } else if (rain > 0) {
    return { emoji: '🌤️', commentary: 'Light intermittent drizzle with dry intervals.' };
  } else {
    return { emoji: '☀️', commentary: 'Optimal clear conditions with no rain recorded.' };
  }
}

function attachRainCanvas(canvasId, rainVal) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;

  if (rainVal <= 0) return;

  const particles = [];
  const count = Math.min(Math.floor(rainVal * 8) + 4, 40);

  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      len: Math.random() * 10 + 5,
      speed: Math.random() * 3 + 2.5
    });
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    particles.forEach(p => {
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - 0.8, p.y + p.len);
      p.y += p.speed;
      if (p.y > canvas.height) {
        p.y = -p.len;
        p.x = Math.random() * canvas.width;
      }
    });
    ctx.stroke();
    const animId = requestAnimationFrame(render);
    activeCanvasRenderers.push(animId);
  }
  render();
}

function renderMatrix() {
  if (!DATA) return;

  activeCanvasRenderers.forEach(id => cancelAnimationFrame(id));
  activeCanvasRenderers = [];

  const station = stationSelect.value;
  const rainData = DATA.payload.Rain[station];

  // Most recent date summary (index 0 since dates are sorted descending)
  const latestRain = rainData.summary[0] !== null ? rainData.summary[0] : 0;
  const latestEval = evaluateWeather(latestRain);

  document.getElementById('heroVal').textContent = `${latestRain} mm`;
  document.getElementById('heroEmoji').textContent = latestEval.emoji;
  document.getElementById('heroStatus').textContent = `Latest Daily Summary (${DATA.dates[0]}) • ${latestEval.commentary}`;

  const table = document.getElementById('matrixTable');
  table.innerHTML = '';

  // Header Row
  const thead = document.createElement('tr');
  thead.appendChild(Object.assign(document.createElement('th'), {textContent: 'Date', className: 'date-col'}));
  DATA.times.forEach(t => thead.appendChild(Object.assign(document.createElement('th'), {textContent: t})));
  thead.appendChild(Object.assign(document.createElement('th'), {textContent: 'Daily Commentary', className: 'summary-col'}));
  table.appendChild(thead);

  // Date Rows (Descending Order)
  DATA.dates.forEach((d, i) => {
    const tr = document.createElement('tr');
    
    const totalRain = rainData.summary[i] !== null ? rainData.summary[i] : 0;
    const evalData = evaluateWeather(totalRain);

    // Date Cell
    const dateTd = document.createElement('td');
    dateTd.className = 'date-cell';
    dateTd.innerHTML = `
      <div class="date-title">${d}</div>
      <div class="date-emoji">${evalData.emoji}</div>
    `;
    tr.appendChild(dateTd);

    // Hourly Cells Beside Date
    DATA.times.forEach((t, j) => {
      const v = rainData.grid[i][j];
      const td = document.createElement('td');
      td.className = 'time-cell';

      // HIDE IF 0 OR NULL
      if (v !== null && v > 0) {
        const fillPercent = Math.min(100, (v / CONFIG.rainfall_cap) * 100);
        
        const waterBar = document.createElement('div');
        waterBar.className = 'water-level-bar';
        waterBar.style.height = `${fillPercent}%`;
        td.appendChild(waterBar);

        const canvas = document.createElement('canvas');
        canvas.className = 'cell-canvas';
        canvas.id = `canvas-${i}-${j}`;
        td.appendChild(canvas);

        const content = document.createElement('div');
        content.className = 'cell-content';
        content.innerHTML = `<span class="val-num">${v}</span><span class="val-unit">mm</span>`;
        td.appendChild(content);

        setTimeout(() => attachRainCanvas(`canvas-${i}-${j}`, v), 50);
      } else {
        // Completely empty cell when 0 or null
        td.innerHTML = `<div class="cell-content"></div>`;
      }

      tr.appendChild(td);
    });

    // Daily Summary Cell
    const sumTd = document.createElement('td');
    sumTd.className = 'summary-cell';
    sumTd.innerHTML = `
      <div class="summary-val">${totalRain > 0 ? totalRain + ' mm Total' : '0 mm'}</div>
      <div class="summary-commentary">${evalData.commentary}</div>
    `;
    tr.appendChild(sumTd);

    table.appendChild(tr);
  });
}

stationSelect.addEventListener('change', renderMatrix);
window.addEventListener('resize', renderMatrix);
window.addEventListener('DOMContentLoaded', autoFetchServerData);
</script>
</body>
</html>
